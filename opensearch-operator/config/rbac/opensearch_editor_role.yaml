# permissions for end users to edit os.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensearchcluster-editor-role
rules:
- apiGroups:
  - sage.opensearch.org
  resources:
  - opensearchcluster
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sage.opensearch.org
  resources:
  - opensearchcluster/status
  verbs:
  - get
